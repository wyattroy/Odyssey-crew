// fullCrewBonus() (D-07, ECON-04): pure read of already-decided state (livingCount()) —
// no RNG, so startCrossing()'s bag composition stays a pure function of CONFIG.crossing/
// crewFavor()/livingCount(). A BONUS only: it only ever ADDS white marbles on top of the
// baseline bag, never removes or adds blue, so a thin crew is never composed a WORSE bag
// than the same crew-favor level would produce at full crew (the anti-spiral guarantee).
function fullCrewBonus(){
  return livingCount() >= CONFIG.crossing.fullCrewAt ? CONFIG.crossing.fullCrewWhiteBonus : 0;
}
function startCrossing(){
  const bag=[];
  for(let i=0;i<CONFIG.crossing.blueStart;i++) bag.push('blue');
  for(let i=0;i<CONFIG.crossing.whiteStart;i++) bag.push('white');
  // D-05: low aggregate crew favor salts the bag toward blue — the world's mood made
  // literal (ECON-02). Replaces the retired curse→extra-blue mapping.
  const extra = seasExtraBlue();
  for(let i=0;i<extra;i++) bag.push('blue');
  // D-07/ECON-04: a near-full living crew adds extra white — more hands at the oars means
  // land comes sooner. This composes with (never replaces) the low-favor blue-salting
  // above: a full, pious crew gets the shortest legs; a thin, impious crew the longest;
  // a thin but pious crew is never worse than baseline, since this only ever adds white.
  const crewBonus = fullCrewBonus();
  for(let i=0;i<crewBonus;i++) bag.push('white');
  // _lastDrawn (BOARD-07 board-only transient): which marble color the reducer just
  // pulled, set by drawMarble() immediately before the render that should show it, and
  // cleared at the top of the next drawMarble() call — never read/written by renderBag().
  state.crossing = { bag, whitesAdded:0, atSea:true, _lastDrawn:null };
  if(extra>0) log(`The crew's favor with the gods runs low — the crossing bag is salted with ${extra} extra blue: a longer, hungrier leg.`,'l-bad');
  if(crewBonus>0) log(`${livingCount()} hands at the oars, nearly the whole crew — the bag carries ${crewBonus} extra white: a shorter leg ahead.`,'l-good');
}
function drawMarble(firstDraw){
  state.crossing._lastDrawn = null; // clear the previous draw's flourish before this one
  if(!firstDraw){ state.crossing.bag.push('white'); state.crossing.whitesAdded++; }
  const bag = state.crossing.bag;
  const idx = rint(bag.length);
  const m = bag.splice(idx,1)[0];
  state.crossing._lastDrawn = m;
  return m;
}
async function runCrossing(){
  if(state.tollSkipNextCrossing){
    state.tollSkipNextCrossing=false;
    log(`⛵ The Phaeacians' magic ship skips this crossing entirely.`,'l-good');
    return;
  }
  startCrossing();
  logBeat(`🌊 A sea crossing begins.`);
  render();
  let first=true;
  while(true){
    if(await deadEndCheck()) return;
    const m = drawMarble(first); first=false;
    renderStrip();
    if(m==='white'){ state.crossing.atSea=false; log(`⚪ Land ho!`,'l-good'); renderStrip(); return; }
    log(`🔵 Still at sea.`,'l-sys');
    // D-06: offer revival once per sea leg, before this leg's meal, so a returning sailor
    // can eat and act this same leg (a cheap no-op via revivalRound()'s own dead-check).
    await revivalRound();
    await eatPhase();
    if(await deadEndCheck()) return;
    if(livingCount()>0) await actPhase('sea', null, 0);
    render();
    await botPause();
  }
}

/* ---------------------------------------------------------------- BEATS --- */
async function runIsland(beat){
  const ep = beat.episode;
  beat.revealed = true;
  state.episode = ep; state.onIsland = true;
  state.ep = { drunk:0, progress:0 };
  state.players.forEach(p=>p.islandFavorEarned=0);
  logBeat(`🏝️ ${ep.title}`);
  flavor(ep.hook);
  render();
  for(let si=0; si<ep.scenes.length; si++){
    const sc = ep.scenes[si];
    if(await deadEndCheck()) break;
    logBeat(`Scene ${si+1}: ${sc.name}`);
    log(`<span class="scene-hook">${sc.hook}</span>`,'l-sys');
    state.ep._drunkBefore = state.ep.drunk; state.ep._progBefore = state.ep.progress;
    // D-06: offer revival at the top of every island scene, before this scene's meal, so
    // a returning sailor can eat and act this same scene (cheap no-op if nobody is dead).
    await revivalRound();
    await eatPhase();
    if(livingCount()>0) await actPhase('land', sc, si);
    // Cyclops scene 3 pride sub-commit
    if(ep.id==='cyclops' && si===2 && ep.prideSubCommit) await ep.prideSubCommit();
    render();
    await botPause();
  }
  if(ep.onDepart) ep.onDepart.call(ep);
  state.onIsland=false; state.episode=null;
  render();
}

async function runHades(){
  logBeat(`💀 Hades — the shore of the dead`);
  flavor('The living may observe the rites, or press the shades for a deeper sight. The drowned may pay Charon to return — or a living mate may pay on their behalf (Orpheus).');
  // ANCHOR-01 (03-05): the living crew's own verb moment, run through the SAME shared
  // act path every island uses (Pitfall 9) — the bespoke peek and revival mechanics below
  // are untouched, and stay AFTER this scene so a sailor's own Dare glimpse composes with
  // (rather than duplicates) the Tiresias peek that follows, and any sailor revived below
  // is aboard when the ship sails (order matters, per the plan).
  const hSc = ANCHORS.hades.scenes[0];
  logBeat(`Scene — ${hSc.name}`);
  log(`<span class="scene-hook">${hSc.hook}</span>`,'l-sys');
  if(livingCount()>0) await actPhase('land', hSc, 0);
  // peek: reveal next face-down island — bespoke, unchanged mechanic (Pitfall 9), now
  // sourced from the shared revealNextIsland() helper the scene's own Dare `fx` also uses.
  const nextIsland = revealNextIsland();
  if(nextIsland){ log(`👁️ Tiresias grants a peek: the next hidden island is <b>${nextIsland.episode.title}</b>.`,'l-favor'); }
  // Hades now reduces to the verb scene, the peek above, plus the same shared revival
  // round every other beat uses (D-06) — the at-Hades toll modifier is honored via
  // revivalRound(true). Fires whether or not anyone is alive to act, and whether or not
  // anyone is dead (revivalRound is a cheap no-op when deadPl() is empty) — ANCHOR-04.
  await revivalRound(true);
  render();
}
// favorRevive(dead, payer, toll): the ONE place a favor toll buys a life back (T-03-06).
// payer may be the dead player themself (self-pay reads as Charon) or a living crewmate
// (crewmate-pay reads as Orpheus). Checks affordability, debits the payer, resurrects the
// dead player with an empty satchel and a cleared lotus flag, logs a line naming who paid,
// and returns whether the toll was paid. Every toll debit in the file routes through this
// one function — no other site may hand-roll a "pay a toll, return a sailor" move.
function favorRevive(dead, payer, toll){
  if(payer.favor < toll) return false;
  payer.favor -= toll;
  dead.status = 'alive';
  dead.satchel = 0;
  dead.lotusStruck = false;
  if(payer===dead){
    log(`⛵ ${dead.name} pays Charon ${toll}🫒 and rejoins the ship.`,'l-good');
  } else {
    log(`🎼 ${payer.name} spends ${toll}🫒 to raise ${dead.name} from the dead (Orpheus) — favor is the win condition, the lifeline and the seas' mood, all spent at once.`,'l-favor');
  }
  return true;
}
// revivalRound(atHades): generalized favor-revival (D-06, ECON-03) — callable from any
// beat (island scenes, sea legs, Hades, and deadEndCheck's favor-bankruptcy check), not
// Hades-only. A cheap, RNG-free no-op when nobody is dead: returns before any prompt, so a
// whole-crew-alive voyage costs nothing (T-03-05 — the loop is strictly draining, never
// cyclical, since every revival spends real favor). Resolves in two passes, both walked in
// resolutionOrder() for deterministic, documented turn order — no rnd() call anywhere in
// this function, and no reordering of any existing rnd() draw (Pitfall 5):
//   1) every dead player may pay their own toll (self-pay, reads as Charon);
//   2) for anyone still dead, the living crew is walked in order offering to pay on their
//      behalf (Orpheus), stopping at the first mate who pays.
// Bots decide silently through botDecide; humans go through askHuman behind the same
// passGate/director-mode gate collectCommits already uses elsewhere — no second masking
// path is introduced (Pitfall 2, T-03-08).
async function revivalRound(atHades){
  if(deadPl().length===0) return;
  const toll = atHades ? CONFIG.charon.hadesToll : CONFIG.charon.toll;
  const dead = resolutionOrder(deadPl());
  await collectCommits(dead, 'revive', {toll});
  for(const p of dead){
    if(p.status!=='dead') continue;
    if(p.commit==='pay'){
      if(!favorRevive(p, p, toll)) log(`${p.name} reaches for Charon's toll but cannot afford it — remains among the dead.`,'l-sys');
    } else {
      log(`${p.name} remains among the dead.`,'l-sys');
    }
  }
  for(const d of resolutionOrder(deadPl())){
    const helpers = resolutionOrder(livingPl()).filter(h=>h.favor>=toll);
    for(const h of helpers){
      let choice;
      if(h.isBot){
        choice = botDecide(h, 'orpheus', {dead:d, toll});
      } else {
        h._committing=true; renderPlayers();
        if(!state.directorMode && state.humanCount>1) await passGate(h);
        choice = await askHuman(h, 'orpheus', {dead:d, toll});
        h._committing=false; renderPlayers();
      }
      if(choice==='pay' && favorRevive(d, h, toll)) break;
    }
  }
}

async function runPhaeacia(){
  logBeat(`🏛️ Phaeacia — the gift-reckoning`);
  flavor('The one house that feeds its guests. Accept graciously, or boast for a bigger prize — then let the court read the favor you already carry, and pay you only in gifts, never in favor.');
  const lc = livingCount();
  // Scene 1: welcome, stores refill — UNCHANGED, scaled by living crew.
  const gift = CONFIG.phaeacia.giftPerPlayer * lc;
  state.hold += gift; log(`🎁 Scene 1 — Welcome: guest-gifts refill the hold (+${gift} → 🛢️ ${state.hold}).`,'l-good');
  renderStrip();
  // Scene 2: The Court — NEW two-verb scene (ANCHOR-02), run through the SAME shared act
  // path every island uses (Pitfall 9). Accept hospitality graciously (Abide, the favor
  // road per the FAVOR LAW above EPISODES) or boast for a bigger personal gift (Dare,
  // risking a xenia-breach). This scene's own favor movement is entirely separate from
  // the Scene 3 song's pool below — the court itself never pays favor either way.
  const pSc = ANCHORS.phaeacia.scenes[0];
  logBeat(`Scene 2 — ${pSc.name}`);
  log(`<span class="scene-hook">${pSc.hook}</span>`,'l-sys');
  if(livingCount()>0) await actPhase('land', pSc, 0);
  render();
  // Scene 3: the song / judgment — UNCHANGED. LOAD-BEARING INVARIANT: this pool is
  // favor-WEIGHTED (more accumulated favor buys more bone throws, clamped between
  // poolFloor/poolCap) and gifts-ONLY (the court pays only rations/the gift-ride here,
  // NEVER favor) — a future tuner must not "simplify" the clamp away or let this pool
  // pay favor; that would turn the anchor into a favor pump breaking the win condition.
  log(`🎵 Scene 3 — The song: each sailor lays their record before the court.`,'l-sys');
  for(const p of livingPl()){
    const n = Math.max(CONFIG.phaeacia.poolFloor, Math.min(CONFIG.phaeacia.poolCap, p.favor));
    const throws=[]; for(let i=0;i<n;i++) throws.push(throwBone());
    const moved = throws.includes(6);
    if(moved){ p.satchel += CONFIG.phaeacia.fullGiftRations; p._tollSkip=true; p._peeked=true;
      log(`${p.name} throws ${n} bone${n>1?'s':''} [${throws.join(',')}] — a 6! The court is moved: +${CONFIG.phaeacia.fullGiftRations}🍖 and the gift-ride.`,'l-good'); }
    else { p.satchel += CONFIG.phaeacia.lesserGiftRations;
      log(`${p.name} throws ${n} bone${n>1?'s':''} [${throws.join(',')}] — the court gives grudgingly: +${CONFIG.phaeacia.lesserGiftRations}🍖.`,'l-sys'); }
    await botPause();
  }
  // Scene 4: gift-ride → skip next crossing (into Ithaca) — UNCHANGED.
  if(livingPl().some(p=>p._tollSkip)){ state.tollSkipNextCrossing=true; log(`🛶 Scene 4 — The gift-ride: the magic ship will skip the crossing to Ithaca.`,'l-good'); }
  render();
}

async function runIthaca(){
  logBeat(`🏰 Ithaca — the homecoming`);
  flavor('The voyage was what the world did to you. This is what you do now that you hold the power. The suitors have drained the house all game — the bill comes due.');
  const living = livingPl();
  living.forEach(p=>p.standing = p.favor);
  // Scene 1 — Beggar (patience)
  logBeat('Scene 1 — The Beggar (patience)');
  await collectCommits(living, 'patience', {});
  for(const p of living){
    if(p.commit==='endure'){ p.standing += CONFIG.ithaca.endureBonus; log(`🧎 ${p.name} endures the insults — standing +${CONFIG.ithaca.endureBonus} (→ ${p.standing}).`,'l-good'); }
    else { p.standing -= CONFIG.ithaca.patiencePenalty; log(`🗡️ ${p.name} reveals early — forfeits standing −${CONFIG.ithaca.patiencePenalty} (→ ${p.standing}).`,'l-bad'); }
  }
  // Scene 2 — Bow (gate)
  logBeat('Scene 2 — The Bow (gated by favor)');
  const eligible = living.filter(p=>p.favor >= CONFIG.ithaca.bowFloor);
  living.filter(p=>p.favor<CONFIG.ithaca.bowFloor).forEach(p=>log(`${p.name} cannot lift the bow — favor ${p.favor} is below the floor of ${CONFIG.ithaca.bowFloor}.`,'l-bad'));
  eligible.sort((a,b)=> b.standing - a.standing);
  let qualifiers = eligible.slice(0, CONFIG.ithaca.qualifyTop);
  if(qualifiers.length===0){
    const fallback = living.slice().sort((a,b)=>b.standing-a.standing)[0];
    log(`No one clears the floor — the hall stays in ruin. ${fallback?fallback.name:'—'} stands highest by default.`,'l-sys');
    qualifiers = fallback ? [fallback] : [];
  } else if(qualifiers.length===1){
    log(`Only ${qualifiers[0].name} clears the floor — they string the bow alone (the last of the faithful).`,'l-favor');
  } else {
    log(`The contest is live: ${qualifiers.map(p=>p.name+' (standing '+p.standing+')').join(' vs ')} qualify for the bow.`,'l-favor');
  }
  // Scene 3 — Reckoning
  logBeat('Scene 3 — The Reckoning');
  const pot = CONFIG.ithaca.suitorPot;
  log(`The suitors carry a stolen pot of ${pot}🫒 — everything they drained from the house.`,'l-sys');
  if(qualifiers.length>0){
    const contrib = new Map();
    let totalHigh=0;
    for(const p of qualifiers){ const b=throwBone(); const c = b>=4 ? b : 0; contrib.set(p,c); totalHigh+=c; log(`${p.name} strikes 🎲${b} → contribution ${c}.`,'l-act'); await botPause(); }
    if(totalHigh===0){
      const share = Math.floor(pot/qualifiers.length);
      qualifiers.forEach(p=>{ p.favor+=share; log(`${p.name} claims ${share}🫒 of the pot (even split — the fight was ugly).`,'l-favor'); });
    } else {
      let handed=0;
      qualifiers.forEach((p,i)=>{ let share = (i===qualifiers.length-1) ? (pot-handed) : Math.round(pot * (contrib.get(p)/totalHigh)); share=Math.max(0,share); handed+=share; p.favor+=share; log(`${p.name} claims ${share}🫒 of the pot by their blows.`,'l-favor'); });
    }
    flavor("Then Penelope's test of the bed — a recognition that confirms who you truly are. (No score; the heart already knows.)");
  } else {
    log(`With no one to string the bow, the suitors are not thrown down. The house stays lost.`,'l-bad');
  }
  render();
  finishGame();
}

/* ---------------------------------------------------------------- SAFETY / END --- */
// deadEndCheck() (D-06, ECON-04): favor bankruptcy is now the ONLY permanent end — this is
// the sole place that ends the game on a wipe, and it always resolves to a verdict rather
// than a stall. The old bespoke auto-Charon branch is retired: when nobody lives, a solvent
// corpse now returns through the ONE shared revival path (favorRevive/revivalRound) instead
// of a hand-rolled toll here. Only if that round still leaves the whole crew dead does this
// log the explicit favor-bankruptcy line and finish the game.
async function deadEndCheck(){
  if(livingCount()>0) return false;
  await revivalRound();
  if(livingCount()>0) return false;
  log(`☠️ The crew could not afford to bring anyone back — favor bankruptcy. The voyage ends here.`,'l-die');
  finishGame(true);
  return true;
}

function finishGame(allDead){
  if(state.over) return;
  state.over = true;
  state.beatIndex = state.journey.length-1;
  renderTrack(); renderPlayers();
  const box = $('prompt');
  const alive = livingPl();
  let winners=[], top=-Infinity;
  const pool = alive.length? alive : state.players;
  pool.forEach(p=>{ if(p.favor>top){ top=p.favor; winners=[p]; } else if(p.favor===top){ winners.push(p); } });
  logBeat('━━━━━━━━━━━━━━━━ THE VERDICT ━━━━━━━━━━━━━━━━');
  if(allDead && alive.length===0){
    log(`No one came home. Odysseus's crew all died — as they did in the poem.`,'l-die');
  } else if(winners.length){
    // Symmetry with the all-dead line: the log always closes THE VERDICT with a
    // verdict sentence, not just the Final-reckoning panel (endgame polish).
    log(`${winners.map(w=>w.name).join(' & ')} come${winners.length>1?'':'s'} home most beloved of the gods 🏆 — 🫒 ${top}.`, CONFIG.log.act);
  }
  const board = state.players.slice().sort((a,b)=> b.favor-a.favor)
    .map(p=>`${winners.includes(p)&&!allDead?'👑 ':'   '}${p.name} — 🫒 ${p.favor} · ${statusTok(p)}`).join('\n');
  let html = `<div class="final"><h2>⚖️ Final reckoning</h2><pre class="mono">${board}</pre>`;
  if(!allDead && winners.length){ html += `<div class="win">Most beloved of the gods: ${winners.map(w=>w.name).join(' & ')} 🏆</div>`; }
  html += `<div class="small" style="margin-top:8px">Reload the page for a fresh voyage.${state.seed?' Same ?seed reproduces this game.':''}</div>`;
  html += `<button class="primary" style="margin-top:10px" onclick="location.reload()">⟲ New voyage</button></div>`;
  box.innerHTML = html;
}

/* ---------------------------------------------------------------- DEAL + RUN --- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rint(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function dealJourney(){
  const pool = shuffle(Object.values(EPISODES).slice());  // 4 episodes → 4 island slots
  const islandDefs = [pool[0], pool[1], pool[2], pool[3]];
  let isl=0;
  const types = ['troy','island','island','hades','island','island','phaeacia','ithaca'];
  state.journey = types.map(t=>{
    if(t==='island'){ return { type:'island', revealed:false, episode: islandDefs[isl++] }; }
    return { type:t };
  });
}

async function setupTroy(){
  logBeat('⚓ Troy — the sack');
  flavor('Before the first crossing, take from the sack. Greed buys survival now; restraint buys favor — and favor buys second lives.');
  await collectCommits(state.players, 'troy', {});
  for(const p of state.players){
    const t = p.commit;
    p.satchel += t; p.favor += (7 - t);
    log(`${p.name} takes ${t}🍖 from Troy and gains ${7-t}🫒 favor.`,'l-act');
  }
  render();
}

async function runGame(){
  validateBeats();
  dealJourney();
  render();
  state.beatIndex = 0;
  await setupTroy();
  for(state.beatIndex=1; state.beatIndex<state.journey.length; state.beatIndex++){
    if(state.over) return;
    render();
    const beat = state.journey[state.beatIndex];
    // crossing precedes every beat after Troy
    await runCrossing();
    if(state.over) return;
    if(await deadEndCheck()) { if(state.over) return; }
    switch(beat.type){
      case 'island':   await runIsland(beat); break;
      case 'hades':    await runHades(); break;
      case 'phaeacia': await runPhaeacia(); break;
      case 'ithaca':   await runIthaca(); return;
    }
    if(await deadEndCheck()) return;
  }
  if(!state.over) finishGame();
}

initFromUrl();
