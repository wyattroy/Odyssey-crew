<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odyssey Crew — Prototype</title>
<style>
  :root{
    --bg:#0b1622; --bg2:#0f2033; --panel:#13273d; --panel2:#173250;
    --ink:#e8eef5; --dim:#9fb3c8; --line:#264a6b;
    --olive:#8fbf4a; --ration:#e0a24a; --danger:#e05a4a; --sea:#2f80c8;
    --safe:#4ab07a; --gold:#e6c34a; --starve:#d9a441; --dead:#6b7d90;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #16324e 0%, var(--bg) 60%);
    color:var(--ink); font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    line-height:1.45; min-height:100vh; padding:12px;
  }
  h1,h2,h3{font-weight:600; margin:0 0 .4em}
  h1{font-size:1.5rem; letter-spacing:.5px}
  .sub{color:var(--dim); font-style:italic; font-size:.9rem; margin:-.2em 0 1em}
  .wrap{max-width:1100px; margin:0 auto}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg2)); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 4px 18px rgba(0,0,0,.35)}
  button{
    font-family:inherit; font-size:.95rem; cursor:pointer; color:var(--ink);
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:9px 14px; margin:4px 4px 4px 0; transition:.12s;
  }
  button:hover:not(:disabled){background:#20456d; border-color:#3a6ea0}
  button:disabled{opacity:.35; cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#2f6aa8,#255488); border-color:#3a7fbf; font-weight:600}
  button.dare{border-color:#8a3b34}
  button.abide{border-color:#3a7a55}
  button.sel{outline:2px solid var(--gold)}
  label{color:var(--dim); font-size:.9rem}
  input,select{font-family:inherit; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 8px}
  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .grow{flex:1 1 auto}

  /* voyage track */
  #boardTrack{overflow-x:auto; padding-bottom:2px}
  .track{display:flex; gap:6px; flex-wrap:nowrap; align-items:stretch; min-width:min-content}
  .beat{position:relative; flex:1 1 90px; min-width:78px; text-align:center; padding:8px 4px; border-radius:9px; border:1px solid var(--line); background:var(--bg2); font-size:.8rem; color:var(--dim)}
  .beat .ic{font-size:1.3rem; display:block; line-height:1.2}
  .beat.cur{border-color:var(--gold); background:#1d3350; color:var(--ink); box-shadow:0 0 0 1px var(--gold) inset}
  .beat.done{opacity:.6}
  .beat .boat{position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:1.15rem; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}

  /* status strip */
  .strip{display:flex; gap:12px; flex-wrap:wrap}
  .stat{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-width:120px}
  .stat .k{font-size:.72rem; color:var(--dim); text-transform:uppercase; letter-spacing:.6px}
  .stat .v{font-size:1.25rem}
  .hold-danger{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset}
  .warn{color:var(--danger); font-size:.82rem; margin-top:2px}

  /* crossing bag marbles (BOARD-02) */
  .bag{display:flex; flex-wrap:wrap; gap:3px; margin:6px 0}
  .marble{width:13px; height:13px; border-radius:50%; display:inline-block;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.4); transition:opacity .25s}
  .marble.blue{background:radial-gradient(circle at 35% 30%, #7fc0ec, var(--sea) 70%); border:1px solid #1d4d7a}
  .marble.white{background:radial-gradient(circle at 35% 30%, #ffffff, #d7e3ef 70%); border:1px solid #9fb3c8}
  .marble.drawn{opacity:.28; filter:grayscale(1)}

  /* dice (BOARD-03) */
  .die{font-size:1.25rem; margin-right:3px; vertical-align:middle; color:var(--ink)}

  /* player panels */
  .players{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px}
  .p{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:11px; padding:10px}
  .p.starving{border-color:var(--starve)}
  .p.dead{border-color:var(--dead); opacity:.62}
  .p.acting{box-shadow:0 0 0 2px var(--gold) inset}
  .p .nm{font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:6px}
  .badge{font-size:.7rem; color:var(--dim); border:1px solid var(--line); border-radius:20px; padding:1px 7px; white-space:nowrap}
  .p .res{margin-top:6px; font-size:.95rem; display:flex; gap:12px; flex-wrap:wrap}
  .p .committing{color:var(--gold); font-size:.82rem; font-style:italic; margin-top:4px}
  .p .bone{margin-top:4px; font-size:.85rem; color:var(--dim)}
  .tok{font-size:.8rem}

  /* action bar (BOARD-04): the existing per-seat ctrl-<id> slot, re-hosted on the
     board (inside the crew card) and styled as a large tappable affordance panel.
     Empty slots (no pending human decision) collapse to nothing. */
  .p .ctrls:empty{display:none; margin:0}
  .p .ctrls{margin-top:8px; display:flex; flex-direction:column; gap:6px;
    background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:10px; padding:8px}
  .p .ctrls button{width:100%; margin:0; font-size:1.02rem; padding:11px 12px; text-align:left}
  .stakes{margin-top:6px; font-size:.8rem; font-weight:normal; color:#93a7bd; line-height:1.6; letter-spacing:.2px}
  .stakes .dot{opacity:.35; margin:0 6px}
  .stakes.rows{display:flex; flex-direction:column; gap:3px}
  .stk-face{opacity:.6; margin-right:2px}
  .stk-num{color:#b9c8da}
  .stk-flav{font-style:italic; opacity:.9}

  /* ship's-log demotion (BOARD-09): a plain <details> panel — closed by default,
     opened when director mode is on. Markup wrapper only; log()/renderLog()/state.log
     underneath are untouched (Pitfall 3). */
  #logPanel summary{cursor:pointer; list-style:none; font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-weight:600; font-size:1.05rem; color:var(--ink); padding:2px 0; user-select:none}
  #logPanel summary::-webkit-details-marker{display:none}
  #logPanel summary::before{content:'▸'; display:inline-block; width:1.1em; color:var(--dim); transition:transform .15s}
  #logPanel[open] summary::before{content:'▾'}
  #logPanel #log{margin-top:8px}

  /* prompt */
  #prompt{min-height:20px}
  #prompt .q{font-size:1.02rem; margin-bottom:6px}
  #prompt .hint{color:var(--dim); font-size:.85rem; margin-bottom:8px}
  .passgate{text-align:center; padding:18px}

  /* narration surface (BOARD-05): the current beat's story tell, sourced from the
     same narrate() text the log records — the board's primary read surface. */
  #narration{min-height:20px}
  #narration .tell{font-size:1.12rem; line-height:1.5}
  #narration .tell.empty{color:var(--dim); font-style:italic; font-size:.92rem}

  /* log */
  #log{max-height:300px; overflow-y:auto; font-size:.9rem; padding-right:6px}
  #log .e{padding:3px 0; border-bottom:1px solid rgba(255,255,255,.04)}
  .l-sys{color:var(--dim)}
  .l-eat{color:#8fc8e0}
  .l-act{color:var(--ink)}
  .l-favor{color:var(--olive)}
  .l-bad{color:var(--danger)}
  .l-good{color:var(--safe)}
  .l-beat{color:var(--gold); font-weight:600; margin-top:4px}
  .l-die{color:var(--danger); font-weight:600}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .flavor{font-style:italic; color:#cfe0d0}
  .scene-hook{font-style:italic; color:#d8c9a6; margin:2px 0 8px; border-left:3px solid var(--line); padding-left:10px}
  .final{font-size:1.1rem}
  .final .win{color:var(--gold); font-weight:700}
  .small{font-size:.82rem; color:var(--dim)}
  .rt{float:right}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧭 Odyssey Crew <span class="small rt" id="seedTag"></span></h1>
  <div class="sub">"Odysseus's crew all died. Will yours survive?"</div>

  <!-- SETUP -->
  <div id="setup" class="card">
    <h2>Set the crew</h2>
    <div class="row" style="margin-bottom:10px">
      <label>Humans:
        <select id="humanCount">
          <option value="0">0 — full-auto demo</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <label>Seed (optional): <input id="seedIn" size="10" placeholder="random"></label>
      <label><input type="checkbox" id="directorIn"> Director mode (no masking)</label>
      <label>Bot speed:
        <select id="botSpeedIn"><option value="0">instant</option><option value="550" selected>brief pause</option></select>
      </label>
    </div>
    <div id="seatSetup" class="players"></div>
    <div style="margin-top:12px">
      <button class="primary" id="startBtn">⛵ Start the voyage</button>
      <span class="small">4 seats always. Humans take P1…Pn; the rest are bots.</span>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="card" id="boardTrack">
      <div class="track" id="track"></div>
    </div>
    <div class="card">
      <div class="strip" id="strip"></div>
    </div>
    <div class="card">
      <div class="players" id="players"></div>
    </div>
    <div class="card" id="narration"></div>
    <div class="card">
      <div id="prompt"></div>
    </div>
    <div class="card">
      <div class="row">
        <label class="small"><input type="checkbox" id="directorToggle"> director mode</label>
        <label class="small">speed <select id="botSpeedToggle"><option value="0">instant</option><option value="550">pause</option></select></label>
      </div>
      <!-- BOARD-09: the transcript is demoted into a collapsible panel — closed by
           default, opened when director mode is on ($('directorToggle').onchange and
           the start-of-game sync below both set logPanel.open). NOT deleted: log()/
           renderLog()/state.log write into the same #log div as before, so the
           0-human seeded run still produces the full transcript regardless of
           whether this panel is expanded (Pitfall 3). -->
      <details id="logPanel">
        <summary>📜 Ship's log</summary>
        <div id="log"></div>
      </details>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   ODYSSEY CREW — single-file playable prototype
   Design source of truth: MDs/create-odyssey-crew.md (build spec wins on conflict)
   All state in one in-memory object. No storage, no network, no libraries.
   ========================================================================== */

/* ---------------------------------------------------------------- VOCABULARY --- */
// VERBS / DELTA_KEYS (D-01/D-04, ECON-01/ECON-02): the single sources of truth for the
// verb grammar and the currency vocabulary. validateBeats() and econcheck.mjs both read
// these — a scene or a payoff cell that strays outside either list fails loud.
const VERBS = ['dare','abide'];
const DELTA_KEYS = ['you','crew','favor'];

/* ---------------------------------------------------------------- CONFIG --- */
const CONFIG = {
  players: 4,
  holdStart: 6,
  meal: 1,
  boneWeights: { 1:0.10, 3:0.40, 4:0.40, 6:0.10 },   // weighted astragaloi
  // crossing.fullCrewAt/fullCrewWhiteBonus (D-07, ECON-04): the keep-the-crew-whole
  // BONUS — shaped as extra white marbles (never fewer blue) when the living crew is at
  // or above fullCrewAt, so more hands at the oars means land comes sooner. This composes
  // with (never replaces) 03-01's low-favor blue-salting: a full, pious crew gets the
  // shortest legs; a thin, impious crew gets the longest; a thin but PIOUS crew is never
  // worse off than baseline, because crew count only ever adds white (see startCrossing).
  // fullCrewAt:3 reads as "near-full" (3 or 4 of the 4 seats living) per D-07's own framing
  // ("a near-full crew draws shorter, safer crossings") — not full-crew-only.
  crossing: { blueStart:5, whiteStart:1, whitePerDraw:1, fullCrewAt:3, fullCrewWhiteBonus:2 },
  // CONFIG.charon (D-06, ECON-03): the favor toll that buys a life back — self-pay (reads
  // as Charon) or crewmate-pay (generalized Orpheus), now offered on ANY beat, not only at
  // the Hades stop. hadesToll is a distinct at-Hades modifier exposed for 03-07 to tune
  // (currently equal to toll — this plan only sets the shape, not the final numbers).
  charon: { toll: 1, hadesToll: 1 },
  // CONFIG.hades (ANCHOR-01, 03-05): the rites-scene's own thematic kickers, tier 0 (a
  // single scene, so no rising arc WITHIN the anchor itself — D-10's escalation is an
  // across-island shape, not a within-one-scene-anchor one). riteHold layers onto econD's
  // abideHold (the hold gain when the rites are observed properly and the dead point out
  // what the ship overlooked); direFavorExtra layers onto econD's dareCaught (the dead's
  // added offense when pressed too hard and refused, beyond the standard caught-cost). The
  // gods' notice on Abide's high roll is econD's own abideFavor — no kicker needed there,
  // per the FAVOR LAW below (Abide is the only favor road, unexceptioned).
  hades: { riteHold: 1, direFavorExtra: 1 },
  troy: { min:1, max:6 },                              // take t → +t rations, +(7-t) favor
  // phaeacia: giftPerPlayer/poolFloor/poolCap/fullGiftRations/lesserGiftRations are the
  // UNCHANGED Scene 3 song's favor-weighted, gifts-only bone-pool payout (03-05 Task 2 —
  // do not touch). xeniaGift/courtGiftBonus/breachFavorExtra (ANCHOR-02, 03-05) are the
  // NEW Scene 2 court verb-scene's own thematic kickers, tier 1 (this anchor sits late in
  // the voyage, so its stakes read above an opening island's, D-10). xeniaGift layers onto
  // econD's abideHold (the modest guest-gift into the hold when hospitality is accepted
  // graciously); courtGiftBonus layers onto econD's dareStash (the bigger personal haul
  // when a boast lands); breachFavorExtra layers onto econD's dareCaught (the xenia-
  // breach's added favor cost beyond the standard caught-cost). These are entirely
  // separate from the song's own pool — the court's own favor grant (Abide's high roll)
  // never touches the pool, and the pool never pays favor either way.
  phaeacia: { giftPerPlayer:2, poolFloor:1, poolCap:5, fullGiftRations:4, lesserGiftRations:1,
              xeniaGift:1, courtGiftBonus:2, breachFavorExtra:1 },
  ithaca:  { bowFloor:1, qualifyTop:2, suitorPot:6, endureBonus:2, patiencePenalty:2 },
  // D-04: lotus.struckOn escalates scene-to-scene (taste -> drowse -> strand) — the
  // faces that take Abide (eating the fruit) from "just a meal" to "lotus-struck".
  // rations (03-03, BALANCE-01): the fruit's own generous kicker, layered via econD()'s
  // `extra` on top of CONFIG.econ's rising per-tier hold contribution on every Abide face
  // (struck or not) — the shore is generous, that is the trap. It no longer feeds the
  // taker's own satchel (`you`); per D-02 the meal goes into the shared hold instead.
  lotus:   { rations:2, struckOn:[[1], [1,3], [1,3,4]] },
  // RE-AUTHORED (03-04): Sirens' own thematic kickers, favor/hold-denominated, tier-
  // indexed [scene1, scene2, scene3] like every other island's D-10 escalation. Scene 1
  // (tier 0) is far enough off the Rocks that a bad listen (Dare face 1) costs only the
  // standard CONFIG.econ.dareCaught favor loss — no ship damage yet (both arrays are 0
  // at index 0). From Scene 2 the Rocks are close enough that the worst face also tears
  // a mate's grip loose (wreckHold — a `crew`/hold loss) and the gods' anger compounds
  // with proximity (wreckFavorExtra — layered onto the standard dareCaught cost via
  // `alwaysD`, not `d`, so it lands even when the hold can't cover the crew draw; see
  // the face-1 cells in EPISODES.sirens and their WR-03 note).
  sirens:  { wreckHold: [0, 1, 2], wreckFavorExtra: [0, 1, 2] },
  helios:  { herd:12, restraintBless:2 },
  // CONFIG.cyclops (BALANCE-01, 03-03): the island's own thematic kickers, layered onto
  // CONFIG.econ's shared tiers via econD()'s `extra` — never a bare integer in a beats
  // cell. winePour is the modest cost the cup itself draws from the ship's stores each
  // time it's poured (Scenes 1-2's Abide); steadyCost is the personal ration a sailor
  // gives up bracing/steadying a mate (Scene 3's Abide). Both are flat across scenes on
  // purpose — the escalation (D-10) comes from CONFIG.econ's own rising tiers underneath.
  cyclops: { need:3, drunkNeeded:2, stakeThreshold:2, boastFavorCost:3, winePour:1, steadyCost:1 },
  // CONFIG.econ — the single two-verb payoff surface (D-10, EFFECT-04): per-scene-tier
  // face maps read by econD() to build every Helios beats cell's `d`. tier 0/1/2 = an
  // episode's 1st/2nd/3rd scene; magnitudes are non-decreasing tier to tier on both
  // roads — that IS the escalating arc. 03-07 tunes these; this plan only sets the shape.
  econ: {
    abideHold:  [ {1:1,3:1,4:2,6:2}, {1:1,3:2,4:2,6:3}, {1:2,3:2,4:3,6:3} ],
    abideFavor: [ {6:1}, {4:1,6:1}, {4:1,6:2} ],
    dareStash:  [ {3:1,4:2,6:3}, {3:1,4:3,6:4}, {3:2,4:4,6:6} ],
    dareCaught: [ {1:-1}, {1:-2,3:-1}, {1:-3,3:-1} ],
  },
  // CONFIG.divine — favor→world thresholds (D-05). Doom/bless thresholds scale PER
  // LIVING CREW MEMBER (the anti-spiral guard confirmed at the Task 3 decision gate):
  // a shrinking crew never by itself pushes the crew toward doom.
  divine: {
    calmPerMate: 3,       // aggregate crew favor per living mate at/above which seas are calm
    roughStep: 2,         // each `roughStep` of favor deficit below the calm line adds one blue marble
    maxExtraBlue: 6,      // cap on extra blue marbles salted into a crossing bag
    doomFloorPerMate: 0,  // aggregate crew favor at/below (doomFloorPerMate * livingCount) triggers collective doom
    blessFloorPerMate: 4, // aggregate crew favor at/above (blessFloorPerMate * livingCount) triggers the blessing branch
    doomMaxToll: 2,       // a doom catastrophe never takes more than this many sailors, and never the last living one
  },
  bot: {
    greedy:   { troyLow:5, troyHigh:6, dareBias:0.72, boast:true,  revealFavor:4, protectsHold:false },
    balanced: { troyLow:3, troyHigh:4, dareBias:0.42, boast:false, revealFavor:99, protectsHold:false },
    pious:    { troyLow:1, troyHigh:2, dareBias:0.16, boast:false, revealFavor:99, protectsHold:true },
  },
  // CONFIG.fx — the canonical home for small shared payoff magnitudes referenced by
  // beats d:{...} cells (EFFECT-04). Scene-specific numbers stay in their own
  // CONFIG.<episode> subobject; only cross-scene/shared magnitudes live here.
  fx: {
    tiny: 1,      // smallest nonzero payoff step (e.g. a single ration or favor point)
    small: 2,     // a modest payoff step
    big: 4,       // a large payoff step (e.g. a Dare-6 hold bounty)
    huge: 6,      // the largest payoff step — reserved for a scene's climactic Dare-6 cell
    penalty: -1,  // smallest nonzero cost/penalty step
  },
  // CONFIG.log — the single home for ship's-log line classes the effect resolver emits
  // (WR-01). Nothing in resolveEffect()/narrate() hardcodes a class literal: change a
  // colour here once and every resolved line follows, or override a single outcome by
  // giving that beats cell its own `cls`. Keep these keys in sync with the .l-* CSS.
  log: {
    act:    'l-act',   // a committed action resolved and changed state
    none:   'l-sys',   // resolved, but nothing stirred
    denied: 'l-bad',   // committed action denied (e.g. the hold was empty)
  },
};

/* ---------------------------------------------------------------- BONE TABLES --- */
// data, not if-chains. verb -> face -> {you, crew, favor} — built from econD() at tier 0
// (D-01/D-02/D-03): the same two-verb payoff surface every scene's beats table draws
// from. Sea keeps its distinct flavor through verbWord(), not through a different
// payoff shape (D-11).
const LAND_TABLE = {
  dare:  { 1:econD('dare',0,1),  3:econD('dare',0,3),  4:econD('dare',0,4),  6:econD('dare',0,6) },
  abide: { 1:econD('abide',0,1), 3:econD('abide',0,3), 4:econD('abide',0,4), 6:econD('abide',0,6) },
};
const SEA_TABLE = {
  dare:  { 1:econD('dare',0,1),  3:econD('dare',0,3),  4:econD('dare',0,4),  6:econD('dare',0,6) },
  abide: { 1:econD('abide',0,1), 3:econD('abide',0,3), 4:econD('abide',0,4), 6:econD('abide',0,6) },
};

/* ---------------------------------------------------------------- RNG SEAM --- */
// DETERMINISM INVARIANT (Pitfall 5, verified after RESOLVE-01/02/03): every rnd()-family
// call (rnd/rint/pick/throwBone, and any bag draw) must happen synchronously inside a
// reducer/phase function (e.g. eatPhase, actPhase, botDecide, dealJourney), in a fixed
// call order driven only by game state — never inside a click handler, a setTimeout/
// sleep callback, or a requestAnimationFrame/render callback. That's what makes the
// same `?seed=` replay byte-identical: resolutionOrder() itself is deterministic (no
// rnd() call) and only reorders WHEN existing rnd() draws are consumed, never adds one.
function makeRng(seedStr){
  if(!seedStr){ return Math.random; }
  let h = 1779033703 ^ seedStr.length;
  for(let i=0;i<seedStr.length;i++){ h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  let a = h >>> 0;
  return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
}
function rnd(){ return state.rng(); }
function rint(n){ return Math.floor(rnd()*n); }
function pick(arr){ return arr[rint(arr.length)]; }
function throwBone(){
  let r = rnd(), acc=0;
  for(const face of [1,3,4,6]){ acc += CONFIG.boneWeights[face]; if(r < acc) return face; }
  return 6;
}

/* ---------------------------------------------------------------- STATE --- */
let state = null;

function newState(opts){
  const rng = makeRng(opts.seed);
  const players = [];
  for(let i=0;i<CONFIG.players;i++){
    players.push({
      id:i, name:opts.names[i] || ("P"+(i+1)),
      satchel:0, favor:0, status:'alive',        // 'alive' | 'starving' | 'dead'
      isBot: opts.isBot[i], temperament: opts.temperament[i],
      commit:null, lastBone:null, islandFavorEarned:0, lotusStruck:false, standing:0,
    });
  }
  return {
    seed:opts.seed, rng,

    onIsland:false,

}

/* ---------------------------------------------------------------- DIVINE ECONOMY --- */
// econD(verb, tier, face, extra): builds a beats-cell delta from CONFIG.econ, so no cell
// ever hand-writes a bare number (EFFECT-04, Pitfall 12). Abide → {crew, favor?}; Dare →
// {you?, favor?}. `extra` is an optional CONFIG-sourced delta a scene merges in for its
// own thematic kicker (e.g. a climactic Dare-6 bounty that also swells the hold) —
// `extra`'s own values must themselves come from CONFIG, never be typed as literals here.
function econD(verb, tier, face, extra){
  const e = CONFIG.econ;
  const d = {};
  if(verb==='abide'){
    if(e.abideHold[tier] && e.abideHold[tier][face]) d.crew = e.abideHold[tier][face];
    if(e.abideFavor[tier] && e.abideFavor[tier][face]) d.favor = e.abideFavor[tier][face];
  } else if(verb==='dare'){
    if(e.dareStash[tier] && e.dareStash[tier][face]) d.you = e.dareStash[tier][face];
    if(e.dareCaught[tier] && e.dareCaught[tier][face]) d.favor = e.dareCaught[tier][face];
  }
  if(extra){ for(const k in extra){ d[k] = (d[k]||0) + extra[k]; } }
  return d;
}
// crewFavor()/seasExtraBlue()/doomFloor()/blessFloor() (D-05): the single causal chain
// that turns private transgressions into collective weather and collective doom.
// Thresholds scale PER LIVING CREW MEMBER (Task 3 decision gate) so a shrinking crew
// never by itself drives the crew toward catastrophe. None of these call the RNG.
function crewFavor(){ return livingPl().reduce((s,p)=>s+p.favor,0); }
function seasExtraBlue(){
  const lc = livingCount();
  if(lc===0) return 0;
  const deficit = (CONFIG.divine.calmPerMate * lc) - crewFavor();
  if(deficit <= 0) return 0;
  return Math.min(CONFIG.divine.maxExtraBlue, Math.ceil(deficit / CONFIG.divine.roughStep));
}
// doomFloor()/blessFloor() scale PER LIVING CREW MEMBER — this IS the deliberate ECON-04
// anti-spiral guard (confirmed at 03-01's Task 3 decision gate, reaffirmed at 03-02 Task
// 2): because both floors are livingCount()*perMate rather than a fixed absolute threshold,
// a shrinking crew never by itself pushes the crew's aggregate favor closer to doom or
// further from blessing — losing a mate cannot compound into a spiral. A future tuner must
// NOT "simplify" this to an absolute threshold; that would reintroduce exactly the
// death-spiral shape this redesign exists to remove.
function doomFloor(){ return CONFIG.divine.doomFloorPerMate * livingCount(); }
function blessFloor(){ return CONFIG.divine.blessFloorPerMate * livingCount(); }
// doomToll(reason): the collective-doom catastrophe helper shared by every episode's
// onDepart doom branch. Caps the toll at CONFIG.divine.doomMaxToll and NEVER takes the
// last living sailor (D-07/ANCHOR-04) — a wipe of a favor-bankrupt crew is exactly the
// dead-end this redesign exists to remove. Uses the existing pick()-family RNG seam
// (already used by onDepart-adjacent helpers like polyphemusHunger/stakeCheck), called
// synchronously from within the game-logic chain — not a render/click/timer callback.
function doomToll(reason){
  const living = livingPl();
  if(living.length<=1) return [];
  const maxTake = Math.min(CONFIG.divine.doomMaxToll, living.length-1);
  const pool = living.slice();
  const victims=[];
  for(let i=0;i<maxTake;i++){
    if(pool.length===0) break;
    const idx = rint(pool.length);
    victims.push(pool.splice(idx,1)[0]);
  }
  victims.forEach(p=>{ p.status='dead'; p.satchel=0; p.lotusStruck=false; });
  return victims;
}

// applyDeltas(p, d): the single mutator for every resolved effect. DELTA_KEYS is
// enforced as a whitelist BEFORE any mutation — an out-of-vocabulary payoff key throws
// instead of silently resolving to nothing (Pitfall 10, T-03-01).
function applyDeltas(p, d){
  if(d){
    for(const k in d){
      if(DELTA_KEYS.indexOf(k)===-1) throw new Error(`applyDeltas: unknown payoff key "${k}" — not in DELTA_KEYS`);
    }
  }
  const parts=[];
  if(d.you){ const b=p.satchel; p.satchel=Math.max(0,p.satchel+d.you); const act=p.satchel-b; if(act) parts.push(`${act>0?'+':''}${act}🍖`); }
  if(d.crew){ const b=state.hold; state.hold=Math.max(0,state.hold+d.crew); const act=state.hold-b; if(act) parts.push(`${act>0?'+':''}${act} hold`); }
  if(d.favor){ p.favor+=d.favor; if(state.onIsland) p.islandFavorEarned+=d.favor; parts.push(`${d.favor>0?'+':''}${d.favor}🫒`); }
  return parts.join(' · ');
}
// deltaStakes(d): PURE, read-only formatter of a beats cell's delta object into a compact
// stakes string — mirrors applyDeltas' emoji vocab (🍖 satchel, 🛢️ hold, 🫒 favor) but
// mutates NOTHING. Used only to PREVIEW per-roll consequences inside the action buttons
// so a human can choose Dare/Abide informed. (No RNG, no state — masking-safe: the
// payoff table is public; only the roll itself stays hidden.)
function deltaStakes(d){
  if(!d) return '';
  const parts=[];
  if(d.you)   parts.push(`${d.you>0?'+':''}${d.you}🍖`);
  if(d.crew)  parts.push(`${d.crew>0?'+':''}${d.crew}🛢️`);
  if(d.favor) parts.push(`${d.favor>0?'+':''}${d.favor}🫒`);
  return parts.join(' ');
}
// stakesLine(vt, p): the per-face (1/3/4/6) preview for ONE verb's beats table. Merges a
// cell's `alwaysD` into its `d` (that penalty always lands). Targeted hybrid: verbs whose
// cells are purely numeric render COMPACT (inline, dot-separated); verbs with any `fx`
// closure (effect not fully numeric — mostly Lotus) render one ROW per face showing the
// number PLUS the authored flavor `tell(p)`, so the hidden risk/effect (e.g. lotus-struck)
// is legible before you commit. Read-only: tell() closures are pure describers.
function stakesLine(vt, p){
  if(!vt) return '';
  const faces=[1,3,4,6];
  const merge=c=>{ const m=Object.assign({}, c.d||{}); if(c.alwaysD) for(const k in c.alwaysD) m[k]=(m[k]||0)+c.alwaysD[k]; return m; };
  const anyFx = faces.some(f=>vt[f] && typeof vt[f].fx==='function');
  if(!anyFx){
    const cells=faces.map(f=>{ const c=vt[f]; if(!c) return `🎲${f} —`; return `🎲${f} ${deltaStakes(merge(c))||'—'}`; });
    return `<div class="stakes">${cells.join('<span class="dot">·</span>')}</div>`;
  }
  const rows=faces.map(f=>{
    const c=vt[f]; if(!c) return '';
    const num=deltaStakes(merge(c));
    let flav=''; if(typeof c.tell==='function'){ try{ flav=c.tell(p); }catch(e){ flav=''; } }
    return `<div class="stk-row"><span class="stk-face">🎲${f}</span>${num?' <span class="stk-num">'+num+'</span>':''}${flav?' <span class="stk-flav">'+flav+'</span>':''}</div>`;
  });
  return `<div class="stakes rows">${rows.join('')}</div>`;
}

// renderBoard() — the board orchestrator (BOARD-07 pure projection): called from the
// existing render() at every post-mutation call site (actPhase/eatPhase/runCrossing/

// fresh from `state` on each call — no parallel/cached position or status field is ever

function renderTrack(){

function renderBag(){
  // BOARD-02: one round marble per entry in state.crossing.bag (blue=sea, white=land),
  // read directly off the array on every call — nothing is cached/tracked board-side, so
  // the bag drains for free once drawMarble() (the reducer) splices it (Pitfall 1/9).
  // No rnd()/rint() here: the draw already happened in the reducer before this renders.
  const bag = state.crossing.bag;
  const marbles = bag.map(m=>`<span class="marble ${m}"></span>`).join('');
  const drawn = state.crossing._lastDrawn
    ? `<span class="marble ${state.crossing._lastDrawn} drawn" title="just drawn"></span>` : '';
  return `<div class="bag">${marbles}${drawn}</div>`;
}
function renderStrip(){
  const s = $('strip'); s.innerHTML='';
  const lc = livingCount();
  const holdDanger = state.hold < lc;
  const hold = el('div','stat'+(holdDanger?' hold-danger':''));
  hold.innerHTML = `<div class="k">Ship's hold</div><div class="v">🛢️ ${state.hold}</div>`
    + (holdDanger?`<div class="warn">can't feed everyone who reaches (${lc} living)</div>`:`<div class="small">safe line: ${lc}</div>`);
  s.appendChild(hold);
  if(state.crossing.atSea){
    const bag = state.crossing.bag;
    const blue = bag.filter(x=>x==='blue').length, white = bag.filter(x=>x==='white').length;
    const total = bag.length;
    const cross = el('div','stat');
    // D-07/ECON-04 (BOARD-07): the living-crew count and the bag advantage/disadvantage it
    // is currently earning, read fresh off state on every render — no cached count, no new
    // transient. Composes the two salting effects into one legible line: a full crew's
    // extra white (fullCrewBonus()) alongside 03-01's low-favor extra blue (seasExtraBlue()).
    const crewBonus = fullCrewBonus();
    const roughBlue = seasExtraBlue();
    const crewLine = crewBonus>0
      ? `${lc} living — nearly whole: +${crewBonus}⚪ this leg`
      : `${lc} living`;
    const bagLine = roughBlue>0 ? `${crewLine} · +${roughBlue}🔵 (low favor)` : crewLine;
    cross.innerHTML = `<div class="k">Crossing bag</div><div class="v">🔵×${blue} ⚪×${white}</div>`
      + renderBag()
      + `<div class="small">land next: ${total? white+'-in-'+total : '—'}</div>`
      + `<div class="small">${bagLine}</div>`;
    s.appendChild(cross);
  }
  // Favor/seas/doom card (D-05, ECON-02): the crew's aggregate standing with the gods —
  // the single legible axis that replaced the two retired peril tracks. Always visible
  // (not gated on onIsland/atSea), so "aggregate favor visibly drives the world" is
  // literally true on the board at every beat, not just island scenes.
  const lc2 = livingCount();
  const favor = crewFavor(), df = doomFloor(), bf = blessFloor(), extraBlue = seasExtraBlue();
  const inDanger = lc2>0 && favor<=df;
  const blessed = lc2>0 && favor>=bf;
  const favorCard = el('div','stat'+(inDanger?' hold-danger':''));
  const seasLine = extraBlue>0 ? `rough (+${extraBlue}🔵/crossing)` : 'calm';
  const doomLine = inDanger ? 'the gods have turned away — doom' : (blessed ? 'the gods smile — blessing' : `doom at ${df}`);
  favorCard.innerHTML = `<div class="k">Crew favor with the gods</div><div class="v">🫒 ${favor}</div>`
    + `<div class="small">seas: ${seasLine} · ${doomLine}</div>`;
  s.appendChild(favorCard);
}

// BOARD-08 MASKING AUDIT (04-04, final pass — no logic changed, confirmed only): every
// board sub-renderer was walked against this seam and found already compliant —
//   - renderPlayers()/renderDice() never read p.commit; the only per-player transients
//     they draw from (_committing, _boneShow, _delta) are verb-agnostic labels or
//     reveal-gated fields set one actor at a time inside actPhase's resolutionOrder()
//     reveal loop (never the all-actors pre-rolled p.lastBone).
//   - bots' commit is set the instant collectCommits starts (`b.commit = botDecide(...)`)
//     but nothing renders p.commit until the reveal loop reads it inside resolveEffect —
//     a bot's choice is exactly as masked as a human's.
//   - every collectCommits() call site (troy/eat/act/pride/revive/patience) and the one
//     hand-rolled sequential-gate loop that bypasses it (Orpheus, runHades) honor the
//     same masked = !directorMode && humans>1 gate before a human's own buttons render
//     in their ctrl-<id> slot; clearPrompt() wipes every ctrl-<id> slot between turns so
//     no stale affordance lingers on another seat.
//   - renderTrack/renderStrip/renderBag (public zones: boat position, hold, favor status,
//     bag) read only state fields with no gate — by design, per the public/private split.
// No new `_`-transient, no new masking branch, no collectCommits/passGate change.
/* The single bot/human seam. kind ∈ 'troy'|'eat'|'act'|'pride'|'revive'|'patience' */
async function collectCommits(seats, kind, ctx){
  ctx = ctx || {};
  const humans = seats.filter(s=>!s.isBot);
  // 1) bots commit silently & instantly
  seats.filter(s=>s.isBot).forEach(b=>{ b.commit = botDecide(b, kind, ctx); });
  // 2) humans commit (masked between humans unless director mode / single human)
  const masked = !state.directorMode && humans.length>1;
  for(const h of humans){
    if(masked){ h._committing=false; renderPlayers(); await passGate(h); }
    h._committing=true; renderPlayers();
    h.commit = await askHuman(h, kind, ctx);
    h._committing=false; renderPlayers();
  }
  return seats.map(s=>s.commit);
}

async function askHuman(p, kind, ctx){
  if(kind==='troy'){
    const btns=[]; for(let t=CONFIG.troy.min;t<=CONFIG.troy.max;t++) btns.push({label:`Take ${t} 🍖 (+${7-t}🫒)`, value:t});
    return promptButtons(`${p.name}: how much do you take from the sack of Troy?`,
      `Greed buys survival now (rations). Restraint buys favor (and favor buys second lives later).`, btns, p.id);
  }
  if(kind==='eat'){
    return promptButtons(`${p.name}: where do you eat? <span class="small">(blind — you can't fall back once you reach for the hold)</span>`,
      `Satchel spends your own 🍖 (${p.satchel} left). Hold spends shared stores (🛢️ ${state.hold}) — but if too many reach, fixed turn order resolves who eats first, and whoever finds it dry last misses the meal.`,
      [ {label:`🍖 Eat my satchel (${p.satchel})`, value:'satchel', disabled:false},
        {label:`🛢️ Reach for the hold`, value:'hold'} ], p.id);
  }
  if(kind==='act'){
    const env = ctx.env, sc = ctx.scene;
    const lab = sc && sc.verbs ? sc.verbs : null;
    const dL = lab&&lab.dare ? lab.dare.label : (env==='sea'?'Dare — fish a sea monster':'Dare — transgress, grab for yourself');
    const aL = lab&&lab.abide? lab.abide.label: (env==='sea'?'Abide — fish with a rod':'Abide — uphold the law (the favor road)');
    // Per-roll stakes preview (read from the scene's public beats table) so the choice is informed.
    const bt = sc && sc.beats ? sc.beats : null;
    const dS = bt ? stakesLine(bt.dare, p) : '';
    const aS = bt ? stakesLine(bt.abide, p) : '';
    return promptButtons(`${p.name}: your move`,
      `Committed in secret. All throw bones together, then reveal one by one. <span class="small">Each box shows what every 🎲 face grants.</span>`,
      [ {label:`⚔️ ${dL}${dS}`, value:'dare', cls:'dare'},
        {label:`🕊️ ${aL}${aS}`, value:'abide', cls:'abide'} ], p.id);
  }
  if(kind==='pride'){
    return promptButtons(`${p.name}: the escape — do you boast?`,
      `Hold your tongue (humble, safe) or boast "It was Odysseus!" for glory — but it costs you ${CONFIG.cyclops.boastFavorCost}🫒 favor with the gods, and low crew favor roughens every crossing still ahead.`,
      [ {label:'🤐 Hold your tongue', value:'abide', cls:'abide'},
        {label:`📣 Boast! (glory, −${CONFIG.cyclops.boastFavorCost}🫒)`, value:'dare', cls:'dare'} ], p.id);
  }
  if(kind==='revive'){
    // D-06: revival is offered on ANY beat now, not only at Hades — ctx.toll carries the
    // caller's toll (CONFIG.charon.toll, or CONFIG.charon.hadesToll at the Hades stop).
    const toll = ctx.toll!=null ? ctx.toll : CONFIG.charon.toll;
    return promptButtons(`${p.name}: you are among the dead. Pay Charon's toll to return?`,
      `Favor is the crew's win condition, its lifeline, and the seas' mood, all the same coin — spend ${toll}🫒 to cross back and rejoin the ship (you have ${p.favor}🫒).`,
      [ {label:`⛵ Pay ${toll}🫒 to return`, value:'pay', disabled:p.favor<toll},
        {label:'💀 Remain in the dark', value:'stay'} ], p.id);
  }
  if(kind==='orpheus'){
    const d = ctx.dead;
    const toll = ctx.toll!=null ? ctx.toll : CONFIG.charon.toll;
    return promptButtons(`${p.name}: raise ${d.name} from the dead? (Orpheus)`,
      `Spend ${toll} of your own 🫒 (you have ${p.favor}) — the same favor that would have won you the game — to bring ${d.name} back. Or let them lie to keep your lead.`,
      [ {label:`🎼 Pay ${toll}🫒 to raise ${d.name}`, value:'pay', disabled:p.favor<toll},
        {label:'…let them lie', value:'no'} ], p.id);
  }
  if(kind==='patience'){
    return promptButtons(`${p.name}: disguised in your own hall — endure the insults, or reveal yourself?`,
      `Endure banks standing toward the bow (+${CONFIG.ithaca.endureBonus}). Revealing early is tempting but forfeits standing (−${CONFIG.ithaca.patiencePenalty}).`,
      [ {label:'🧎 Endure (patience)', value:'endure', cls:'abide'},
        {label:'🗡️ Reveal yourself now', value:'reveal', cls:'dare'} ], p.id);
  }
  return null;
}

/* ---------------------------------------------------------------- BOT POLICY --- */
function botDecide(p, kind, ctx){
  const T = CONFIG.bot[p.temperament] || CONFIG.bot.balanced;
  const lc = livingCount();
  if(kind==='troy'){
    let t = T.troyLow + rint(T.troyHigh - T.troyLow + 1);
    t += (rnd()<0.5?-1:1)*(rnd()<0.5?1:0);       // ±1 jitter
    return Math.max(CONFIG.troy.min, Math.min(CONFIG.troy.max, t));
  }
  if(kind==='eat'){
    if(p.satchel<=0) return 'hold';                    // forced
    const holdSafe = state.hold >= lc;
    if(holdSafe){
      if(p.temperament==='pious' && state.hold === lc) return 'satchel'; // don't strain a just-safe hold
      return 'hold';                                    // spare my satchel
    }
    // hold is short
    if(p.temperament==='greedy' && rnd()<0.5) return 'hold';           // gamble
    if(p.satchel===1 && rnd()<0.5) return 'hold';                      // last-ration reasoning
    return 'satchel';
  }
  if(kind==='act'){
    return botAct(p, ctx, T);
  }
  if(kind==='pride'){
    return (T.boast && rnd()<0.7) ? 'dare' : 'abide';
  }
  if(kind==='revive'){
    const toll = ctx.toll!=null ? ctx.toll : CONFIG.charon.toll;
    return p.favor>=toll ? 'pay' : 'stay';
  }
  if(kind==='orpheus'){
    const d = ctx.dead;
    const toll = ctx.toll!=null ? ctx.toll : CONFIG.charon.toll;
    const canSpare = p.favor - toll >= CONFIG.ithaca.bowFloor;
    if(!canSpare) return 'no';
    if(p.temperament==='pious') return 'pay';
    if(p.temperament==='balanced' && livingCount()<=2) return 'pay';
    return 'no';
  }
  if(kind==='patience'){
    if(p.temperament==='greedy' && p.favor>=T.revealFavor && rnd()<0.6) return 'reveal';
    return 'endure';
  }
  return null;
}

function botAct(p, ctx, T){
  const env = ctx.env, ep = state.episode, sc = ctx.scene, lc = livingCount();
  const holdShort = state.hold < lc;
  const hungry = p.satchel<=1 && !(state.hold>lc);

  // ---- episode overrides (respect the scene's shape) ----
  // NOTE (D-01/D-11): the third verb (Give) is gone — its "feed the commons" function
  // is now Abide's base effect (D-02), so every branch below that used to pick 'give'
  // now picks 'abide' instead.
  if(ep){
    if(ep.id==='helios'){
      if(p.temperament==='pious') return 'abide';
      if(state.hold<=1) return 'abide';
      if((hungry || p.temperament==='greedy') && rnd()<T.dareBias+0.15) return 'dare';
      return 'abide';
    }
    if(ep.id==='cyclops'){
      if(ctx.sceneIndex===0){ // The Wine: get him drunk (Abide now pours the wine too)
        return rnd()<0.75 ? 'abide' : 'dare';
      }
      if(ctx.sceneIndex===1){ // The Stake: dare together when drunk
        if(state.ep.drunk >= CONFIG.cyclops.drunkNeeded) return 'dare';
        return 'abide';
      }
      if(ctx.sceneIndex===2){ return 'dare'; }           // slip out under the sheep
    }
    if(ep.id==='sirens'){
      // RE-AUTHORED (03-04): greedy sailors listen for the kleos/stash, pious sailors
      // stay bound to the ropes; anyone eases off Dare once the crew's aggregate favor
      // has already sunk to the reef-line, since another bad listen only pushes the
      // ship closer to doomToll().
      if(p.temperament==='greedy') return 'dare';         // listen
      if(crewFavor()<=doomFloor()) return 'abide';        // ease the Rocks when favor runs low
      if(p.temperament==='pious') return 'abide';
      return rnd()<0.5 ? 'dare' : 'abide';
    }
    if(ep.id==='lotus'){
      // D-04 inverts the usual mapping here: Abide is the risky "give in to the fruit"
      // road and Dare is the safe "haul back" road (same rescue move in all 3 scenes,
      // no longer just scene 2) — so the temperament split below is the mirror image
      // of every other island's lotus/dare-favor-free branches above.
      const struck = state.players.find(x=>x.lotusStruck && notDead(x));
      if(struck && p.temperament!=='greedy') return 'dare'; // go haul a struck mate back
      if(p.temperament==='greedy') return 'abide';   // give in to the free ration — self first
      if(p.temperament==='pious') return 'dare';     // resist, mind kept on Ithaca
      return rnd()<0.5?'dare':'abide';
    }
  }

  // ---- generic policy ----
  if(hungry && rnd() < T.dareBias + 0.2) return 'dare';                        // grab / fish to refill
  if(holdShort && (T.protectsHold || rnd()<0.4)) return 'abide';              // Abide now fills the hold
  if(!holdShort && rnd() < (p.temperament==='pious'?0.7:0.45)) return 'abide'; // favor road
  if(rnd() < T.dareBias) return 'dare';
  return 'abide';
}

/* ---------------------------------------------------------------- RESOLUTION ORDER SEAM --- */
// v1.1 RESOLUTION-ORDER SEAM (RESOLVE-03): blind commits (collectCommits) stay
// simultaneous — nothing upstream of this changes. But once a reveal draws on the
// shared hold (a commons), someone has to be resolved first. This function is the
// SINGLE, ISOLATED seam that decides who: v1.1 uses fixed turn order (ascending seat
// id). To move to a favor-weighted order or a passed turn-chip scheme later, swap ONLY
// this function — no other resolution logic (eatPhase's hold loop, the Act reveal loop,
// canAffordDraw) needs to change. Deterministic: this function must never call rnd().
function resolutionOrder(actors){
  return actors.slice().sort((a,b)=>a.id-b.id);
}

// canAffordDraw(d): the single "deny, never partially apply" feasibility gate shared by
// eat and act resolution (RESOLVE-02). A delta whose hold draw would overdraw the
// shared hold is wholly unaffordable — callers must skip applyDeltas (and any fx)
// entirely rather than let applyDeltas's clamp silently shrink a committed draw to a
// partial one.
// WR-05 (scope note): this is a GENERAL invariant, not just the one remaining named
// reskin patch. It fires for EVERY hold-drawing cell routed through resolveEffect — beats
// cells AND the LAND_TABLE/SEA_TABLE fallback (so sea-crossing dares that draw on the hold
// are covered too) — plus the reskin closures that draw the hold directly (Cyclops "The
// Stake"). This broad coverage is intended (deny-not-clamp everywhere the commons is
// spent); Phase 3 balance verification should confirm it reads correctly across the sea/
// land dares now included.
function canAffordDraw(d){
  return !(d && d.crew < 0 && state.hold + d.crew < 0);
}

/* ---------------------------------------------------------------- EAT PHASE --- */
async function eatPhase(){
  const eaters = livingPl();
  if(eaters.length===0) return;
  eaters.forEach(p=>p._committing=true); renderPlayers();
  await collectCommits(eaters, 'eat', {});
  clearBones(); renderPlayers(); renderNarration();

  const satchelEaters = eaters.filter(p=>p.commit==='satchel');
  const holdReachers  = eaters.filter(p=>p.commit==='hold');

  // satchel eaters resolve immediately
  for(const p of satchelEaters){
    if(p.satchel>0){ p.satchel--; feed(p); log(`${p.name} eats from their own satchel.`,'l-eat'); }
    else { log(`${p.name} reached into an empty satchel — no meal.`,'l-eat'); miss(p); }
  }
  // hold reachers: resolved SEQUENTIALLY in fixed turn order against the shared hold
  // (RESOLVE-01/02) — one ration is spent at a time via resolutionOrder(); a reacher
  // who finds the hold already dry is denied and skipped outright — never partially
  // fed, and never decided by a bone lot-cast (the old simultaneous-feasibility check
  // this replaces).
  if(holdReachers.length>0){
    log(`${holdReachers.length} sailor${holdReachers.length>1?'s':''} reach for the hold (🛢️ ${state.hold}).`,'l-eat');
    for(const p of resolutionOrder(holdReachers)){
      if(state.hold>0){
        state.hold--; feed(p);
        log(`${p.name} draws from the hold (🛢️ ${state.hold} left).`,'l-eat');
      } else {
        log(`${p.name} reaches for the hold, but it has already run dry — denied, meal missed.`,'l-bad');
        miss(p);
      }
      // WR-02: re-render per reacher so the shared hold visibly drains and each
      // sailor's fate lands one at a time (matches the Act reveal loop).
      renderStrip(); renderPlayers();
      await botPause();
    }
  }
  renderPlayers();
}
function feed(p){ if(p.status==='starving'){ p.status='alive'; log(`${p.name} eats and is no longer starving.`,'l-good'); } }
function miss(p){
  if(p.status==='starving'){ p.status='dead'; p.satchel=0; p.lotusStruck=false; log(`💀 ${p.name} misses a second meal and dies. Their satchel spills to the sea; their soul goes to the shore of the dead.`,'l-die'); }
  else if(p.status==='alive'){ p.status='starving'; log(`${p.name} is now starving — too weak to act next turn.`,'l-bad'); }
}

/* ---------------------------------------------------------------- EFFECT ENGINE --- */
// resolveEffect() is the single generic resolver for a scene's Dare/Abide/Give reveal:
// it prefers the declarative `scene.beats[verb][bone]` cell (EFFECT-01/02), falls back
// to a scene's custom `reskin[verb]` closure (existing per-scene override — still logs
// its own line, so resolveEffect must not narrate it a second time), and finally falls
// back to the generic LAND_TABLE/SEA_TABLE — so an unconverted scene always keeps
// working exactly as before. The `|| {}` default is preserved so a sparse/undeclared
// cell never throws.
// A beats cell may carry an optional `fx:(p,bone)=>void` escape hatch for genuine extra
// state mutation a flat `d` can't express (e.g. a persistent per-episode counter). fx
// runs first, then `d` is applied via the unchanged applyDeltas, then `tell` is read —
// so tell can narrate the post-mutation state, and narration authoring always has
// exactly one home (the cell's own `tell`) whether or not the cell needs custom logic.
// Escape-hatch cells must never hand-write their own log() line.
// Every path below that would call applyDeltas first runs it through canAffordDraw() —
// the shared "deny, never partially apply" feasibility gate (RESOLVE-02): a committed
// cell whose net hold draw would overdraw the shared hold is denied as a whole (fx and
// applyDeltas both skipped), never silently clamped to a partial amount. A cell may also
// carry `alwaysD` (WR-03) — a delta that lands regardless of that denial, for a bundled
// non-hold penalty that must not be voided by an unrelated empty-hold `d` draw.
const HOLD_DENIED_TELL = `The hold has nothing left to give — the move fails for want of it.`;
function resolveEffect(p, scene, verb, bone, env){
  if(scene && scene.beats && scene.beats[verb] && scene.beats[verb][bone]){
    const cell = scene.beats[verb][bone];
    // WR-03: a cell may declare `alwaysD` — a delta applied unconditionally, even when
    // the cell's main `d` hold-draw below is denied by canAffordDraw. This lets a
    // non-hold penalty bundled into the same cell as a `crew` draw (e.g. Sirens'
    // world/doom cost alongside a wreck crew-loss) still land when the hold can't cover
    // the crew draw, instead of being silently voided by the deny-whole-cell invariant
    // (WR-05) that governs `d` itself — that invariant is correct and unchanged.
    const alwaysApplied = cell.alwaysD ? applyDeltas(p, cell.alwaysD) : '';
    if(!canAffordDraw(cell.d)){
      const applied = alwaysApplied || 'denied — hold empty';
      const tell = alwaysApplied && typeof cell.tell === 'function' ? cell.tell(p) : HOLD_DENIED_TELL;
      return { applied, tell, cls: cell.cls || CONFIG.log.denied, logged:false, denied:true };
    }
    if(typeof cell.fx === 'function') cell.fx(p, bone);
    const applied = applyDeltas(p, cell.d || {});
    const combined = [alwaysApplied, applied].filter(Boolean).join(' · ');
    const tell = typeof cell.tell === 'function' ? cell.tell(p) : '';
    return { applied: combined, tell, cls: cell.cls || (combined ? CONFIG.log.act : CONFIG.log.none), logged:false };
  }
  if(scene && scene.reskin && scene.reskin[verb]){
    const applied = scene.reskin[verb](p, bone);   // existing closure: mutates + logs + returns narration
    return { applied, tell:'', cls:null, logged:true };
  }
  const table = env==='sea' ? SEA_TABLE : LAND_TABLE;
  const d = (table[verb] && table[verb][bone]) || {};
  if(!canAffordDraw(d)){
    return { applied:'denied — hold empty', tell: HOLD_DENIED_TELL, cls: CONFIG.log.denied, logged:false, denied:true };
  }
  const applied = applyDeltas(p, d);
  return { applied, tell:'', cls:null, logged:false };
}

// narrate() is the single place a ship's-log line is assembled from a resolved effect —
// name, verb word, die face, the mechanical fragment, then the story `tell` sentence.
// Mirrors the format the old generic table-fallback branch always logged with ('l-act').
// This is the one place the sentence is built so the same text can later drive the board.
function narrate(p, verb, env, bone, tell, applied){
  const base = `${p.name} ${verbWord(verb,env)} 🎲${bone} → ${applied||'nothing stirs'}.`;
  const html = tell ? `${base} ${tell}` : base;
  return { html, cls: CONFIG.log.act };
}

/* ---------------------------------------------------------------- ACT PHASE --- */
async function actPhase(env, scene, sceneIndex){
  const actors = actingPl();
  const skipped = state.players.filter(p=>p.status==='starving');
  skipped.forEach(p=>log(`${p.name} is starving — their Act is skipped.`,'l-sys'));
  state.players.filter(p=>p.lotusStruck && notDead(p)).forEach(p=>log(`${p.name} drifts, lotus-struck — cannot act.`,'l-sys'));
  if(actors.length===0){ log(`No one is able to act.`,'l-sys'); return; }

  clearBones();
  actors.forEach(p=>{ p._acting=true; p._committing=true; });
  renderPlayers(); renderNarration();
  await collectCommits(actors, 'act', {env, scene, sceneIndex});
  actors.forEach(p=>p._committing=false); renderPlayers();

  // throw all bones (blind, simultaneous — everyone throws together), then reveal one
  // at a time in resolutionOrder() so a hold-drawing move is checked against whatever
  // an earlier-in-order player already spent from the shared hold this reveal
  // (RESOLVE-02/03: the same ordering seam that governs eatPhase's hold resolution).
  actors.forEach(p=>{ p.lastBone = throwBone(); });
  for(const p of resolutionOrder(actors)){
    p._boneShow = p.lastBone;
    const r = resolveEffect(p, scene, p.commit, p.lastBone, env);
    if(!r.logged){
      const n = narrate(p, p.commit, env, p.lastBone, r.tell, r.applied);
      // WR-01: honor the resolver's computed class (l-act applied / l-sys no-op /
      // l-bad denied) instead of narrate()'s flat 'l-act'. Table-fallback cells carry
      // no class (r.cls null), so fall back to narrate()'s default for those.
      const cls = r.cls || n.cls;
      log(n.html, cls);
      // BOARD-05: same html/cls just logged — one narration source (Pitfall 3).
      state._narration = { html: n.html, cls };
    }
    p._delta = r.applied || 'no change';
    renderPlayers(); renderNarration();
    await botPause();
  }
  // collective check for the scene
  if(scene && scene.collectiveCheck){ scene.collectiveCheck(actors); renderStrip(); }
  renderStrip(); renderPlayers();
}
function verbWord(v, env){
  if(v==='dare') return env==='sea'?'fishes for a monster':'dares';
  return env==='sea'?'fishes with a rod':'abides';
}

/* ---------------------------------------------------------------- FAVOR LAW --- */
// THE FAVOR LAW (D-02/D-03/D-05/D-11, BALANCE-03, T-03-13 — consolidated 03-04 Task 2).
// This is the ONE place the law is stated. Every island's own design-note comment below
// points back here rather than restating it — if you are re-authoring a scene or adding
// a payoff cell anywhere in EPISODES/ANCHORS, this is the contract it must hold to.
//
// THE LAW:
//   - Abide is the favor road. Abide ALWAYS feeds the shared hold (the commons), and a
//     HIGH roll additionally earns the gods' notice — favor (econD's abideHold/abideFavor,
//     D-02). This is the only verb that GRANTS favor anywhere in the game.
//   - Dare's only relationship to favor is a COST. Dare always feeds the actor's own
//     stash; a LOW roll means the gods catch you and favor is lost (econD's dareStash/
//     dareCaught, D-03). Dare NEVER grants favor — not on any island, not on any face.
//   - Nothing else moves favor except four NAMED VOYAGE-LEVEL SOURCES, each a deliberate,
//     game-structural event rather than a per-turn verb payoff:
//       1. The Troy allocation (setupTroy) — restraint at the sack buys favor up front.
//       2. An island's departure blessing — currently only Helios's onDepart (a full
//          aggregate-favor blessing to all living crew when favor clears blessFloor()).
//       3. The revival tolls (favorRevive, self-pay/Charon or crewmate-pay/Orpheus) —
//          favor spent, never earned, to buy a life back.
//       4. Ithaca's Reckoning pot (runIthaca) — the finale's one-time payout to whoever
//          qualifies for and wins the bow contest.
//   - The favor-road's own bookkeeping is survival-contingent: `p.islandFavorEarned`
//     tracks the NET favor delta (positive or negative) a player accrues while on the
//     current island. A player who dies before the island resolves forfeits any
//     favor-road gains earned there (the death-clawback sites in Cyclops's
//     polyphemusHunger/stakeCheck/onDepart all read Math.max(0, victim.islandFavorEarned)
//     — a net-negative island, i.e. one where Dare's own costs already outweighed any
//     Abide gains, is NEVER refunded on death; the clawback can only ever remove favor
//     actually earned via the favor road, never hand back a Dare cost as a death bonus).
//
// SANCTIONED EXCEPTIONS (a list, kept here and ONLY here — an exception recorded
// anywhere else is a copy-paste risk, not a second source of truth):
//   - NONE, as of this plan. The three-verb model's single historical exception (a high
//     Dare roll at the Sirens blessed with favor) is RETIRED under two verbs (03-04 Task
//     1's Dare-favor decision — see EPISODES.sirens's own design note for the full
//     reasoning). Cyclops's stake (03-03) and the Sirens retirement above were each the
//     one place their own island COULD have taken a Dare-favor-grant exception, and
//     neither does. The favor law is, as of 03-04, fully exceptionless: Abide is the
//     only favor road, on every island, with no carve-outs.
//   - A future author who adds one MUST add it here first, with a one-line rationale,
//     before writing the cell that implements it (Pitfall 6 — favor-law drift).
//
// AUDIT (03-04 Task 2): every live `favor`-touching site in this file was walked and
// classified into exactly one of the categories above; see 03-04-SUMMARY.md's audit
// table for the full site-by-site record. One inconsistency was found and fixed as part
// of this audit (Cyclops onDepart's death-clawback was missing the same
// Math.max(0, islandFavorEarned) guard its sibling sites already had — see git history
// for this plan's commit).

/* ---------------------------------------------------------------- EPISODES --- */

// (mkHeliosDare(), the reskin closure all three Helios scenes shared through the Phase-1
// tracer, is retired as of 02-01: every Helios scene now resolves entirely through its
// own beats table — see EPISODES.helios.scenes below.)
const EPISODES = {

    // TRACER (03-01): Helios is the whole new economy proven end-to-end on ONE island —
    // every `d` below is built by econD(verb, tier, face[, extra]) from CONFIG.econ, so

    // branches, same shape as before: catastrophe / blessing / simmering escape — but

    // thresholds, T-03-03) instead of the retired world track. The catastrophe is
    // capped via doomToll() and never takes the last living sailor (D-07/ANCHOR-04).
    onDepart(){
      const favor = crewFavor(), df = doomFloor(), bf = blessFloor();

        const victims = doomToll('helios');
        const named = victims.length ? victims.map(v=>v.name).join(', ') : null;
        log(`☀️ The crew's favor with the gods (${favor}) has sunk to the wrath-line. As the ship departs, the sea rises${named?` and swallows ${named}`:''} — Helios's fury is spent.`,'l-die');

        log(`☀️ The herd stayed nearly whole — the crew's favor (${favor}) shines bright. Helios blesses restraint — +${CONFIG.helios.restraintBless}🫒 to all living.`,'l-favor');

        log(`☀️ The ship escapes Thrinacia — the crew's favor (${favor}) holds the gods' hand steady.`,'l-sys');
      }
    }

    // recklessness, per the verb-reading above) but must never GRANT it — the island's
    // only favor GRANTS come from Abide's high rolls. The stake's collective success

    // SUMMARY's recorded decision). The boast below costs the boaster's OWN favor
    // (folded from the retired curse track) and, because favor now drives seasExtraBlue()
    // for every living sailor, that cost roughens every crossing still ahead — same shape
    // the retired curse track had, through the one currency.
    async prideSubCommit(){
      const survivors = actingPl();
      if(survivors.length===0) return;
      logBeat('— The Pride —');
      flavor('Safe on the water, each sailor decides, in secret, whether to shout their own name back at the shore.');
      await collectCommits(survivors, 'pride', {});
      for(const p of survivors){
        if(p.commit==='dare'){
          p.favor -= CONFIG.cyclops.boastFavorCost;
          log(`📣 ${p.name} BOASTS "It was Odysseus!" — glory, and nothing else. The gods take note: favor −${CONFIG.cyclops.boastFavorCost} (→ ${p.favor}), and the seas ahead grow rougher for it.`,'l-bad');
        } else {
          log(`🤐 ${p.name} holds their tongue — no glory, no cost.`,'l-sys');
        }
      }
    },

    }

// D-04/D-05 Lotus helpers, shared across all three scenes above:
//   - lotusAbideFx(sceneIdx) returns the fx closure Abide uses: the strand flag itself is
//     a boolean flip a flat `d` can't express — CONFIG.lotus.struckOn[sceneIdx] is the
//     single source of truth for which faces strand on which scene (escalating taste ->
//     drowse -> strand, D-09), read fresh on every call (no bare integers). The free-meal
//     hold contribution lives declaratively in each cell's own `d` (econD + the
//     CONFIG.lotus.rations kicker), same as every other beats cell.
//   - lotusDareFx is identical across all three scenes: find a struck living mate and
//     clear them (a small satchel cost, same as the shipped lotusRescue it replaces),
//     but grant NO favor (D-05 — this is the retune). The outcome is stashed on
//     state.ep for lotusDareTell() to narrate, since resolveEffect's tell(p) signature
//     only receives the acting player, not the fx result.
function lotusAbideFx(sceneIdx){
  return (p,b)=>{ if(CONFIG.lotus.struckOn[sceneIdx].includes(b)) p.lotusStruck = true; };
}
function lotusDareFx(p,b){
  const struck = state.players.find(x=>x.lotusStruck && notDead(x));
  if(struck){ struck.lotusStruck=false; if(p.satchel>0)p.satchel--; state.ep.lotusFreed = struck.name; }
  else { state.ep.lotusFreed = null; }
}
function lotusDareTell(p, manner){
  return state.ep.lotusFreed
    ? `You wade back into the sand, ${manner}, and haul ${state.ep.lotusFreed} to their feet — no glory in it, just a mate saved.`
    : `No one lies stranded to save this time — you haul your own feet back toward the ship, ${manner}.`;
}

/* --- Cyclops collective helpers --- */
function polyphemusHunger(progressed){
  if(!progressed){
    const victim = pick(livingPl());
    if(victim){ log(`🦖 No progress — Polyphemus gropes and devours ${victim.name}! They miss the rest of the episode and lose the favor earned here.`,'l-die');
      victim.favor = Math.max(0, victim.favor - Math.max(0,victim.islandFavorEarned));
      victim.status='dead'; victim.satchel=0; }
  }
}
// D-05/BALANCE-01 (03-03 decision): the stake's collective success is the one place a
// Dare-favor GRANT could be added as a sanctioned, explicitly flagged exception (the same
// pattern Sirens uses, D-05). This plan does NOT take that option — the blinding rewards
// escape progress alone, keeping Cyclops's only favor GRANTS on Abide's high rolls. Do not
// add a favor grant on the success branch below without also flagging it here.
function stakeCheck(actors){
  const darers = actors.filter(p=>p.commit==='dare');
  if(darers.length===0){ log(`No one drives the stake — the moment passes.`,'l-sys'); polyphemusHunger(false); return; }
  if(darers.some(p=>p.lastBone===1)){
    log(`The stake slips (a pooled 🎲1) — Polyphemus wakes, roaring!`,'l-bad');
    const victim = pick(livingPl()); if(victim){ log(`💀 He seizes ${victim.name}.`,'l-die'); victim.status='dead'; victim.satchel=0; victim.favor=Math.max(0,victim.favor-Math.max(0,victim.islandFavorEarned)); }
    return;
  }
  const highs = darers.filter(p=>p.lastBone>=4).length;
  const threshold = Math.max(1, CONFIG.cyclops.stakeThreshold - Math.floor(state.ep.drunk/2));
  if(highs >= threshold){
    state.ep.progress += 2;
    log(`🔥 The stake drives home! (${highs} high faces vs threshold ${threshold}) — Polyphemus is BLINDED. Escape ${state.ep.progress}/${state.episode.need}.`,'l-good');
  } else {
    log(`The stake glances off (${highs} high faces vs threshold ${threshold}). He stirs but sleeps on.`,'l-sys');
  }
}

// validateBeats() enforces beats-table completeness for every scene that opts into the
// beats path: a declared scene must use EXACTLY the verbs in VERBS (D-01/ECON-01), any
// declared verb must define all four bone faces {1,3,4,6}, each defined cell must be
// well-formed (a `tell` function + a `d` object), and every cell's `d`/`alwaysD` keys
// must be inside DELTA_KEYS (ECON-02) — an out-of-vocabulary payoff key fails LOUD
// (console.error + on-screen l-bad log + throw) rather than silently resolving to
// nothing (closes Pitfall 10 — see .planning/research/PITFALLS.md).
// A scene with no `beats` field at all is NOT a failure — it is a legitimate,
// not-yet-converted scene still served by the reskin/LAND_TABLE/SEA_TABLE fallback.
function validateBeats(){
  const problems = [];
  const notYetConverted = [];
  // ANCHOR-04: ANCHORS joins the SAME fail-loud coverage gate EPISODES already uses — an
  // anchor cell cannot be authored outside this gate (Pitfall 10).
  [...Object.values(EPISODES), ...Object.values(ANCHORS)].forEach(ep=>{
    ep.scenes.forEach(sc=>{
      if(!sc.beats){ notYetConverted.push(`${ep.id} / ${sc.name}`); return; }
      const verbsDeclared = Object.keys(sc.beats).slice().sort();
      const verbsExpected = VERBS.slice().sort();
      if(verbsDeclared.length !== verbsExpected.length || !verbsDeclared.every((v,i)=>v===verbsExpected[i])){
        problems.push(`${ep.id} / ${sc.name}: declares verbs [${verbsDeclared.join(',')}], expected exactly [${verbsExpected.join(',')}]`);
      }
      Object.keys(sc.beats).forEach(verb=>{
        const table = sc.beats[verb];
        [1,3,4,6].forEach(face=>{
          const cell = table[face];
          if(!cell){
            problems.push(`${ep.id} / ${sc.name} / ${verb} / face ${face}: missing cell`);
            return;
          }
          const wellFormed = typeof cell.tell === 'function' && cell.d && typeof cell.d === 'object';
          if(!wellFormed){
            problems.push(`${ep.id} / ${sc.name} / ${verb} / face ${face}: dead cell (needs a tell function and a d object)`);
            return;
          }
          [['d',cell.d],['alwaysD',cell.alwaysD]].forEach(([label,obj])=>{
            if(!obj) return;
            Object.keys(obj).forEach(k=>{
              if(DELTA_KEYS.indexOf(k)===-1) problems.push(`${ep.id} / ${sc.name} / ${verb} / face ${face}: ${label} key "${k}" not in DELTA_KEYS`);
            });
          });
        });
      });
    });
  });
  if(problems.length){
    console.error('validateBeats: beats coverage problem(s) found:\n' + problems.join('\n'));
    log(`<b>BEATS VALIDATION FAILED</b> (${problems.length}): ${problems.join(' | ')}`,'l-bad');
    throw new Error(`validateBeats: ${problems.length} beats coverage problem(s) — ${problems.join(' | ')}`);
  }
  if(notYetConverted.length){
    console.log('validateBeats: scenes not yet on the beats path (informational): ' + notYetConverted.join(', '));
  }
  return { ok:true, notYetConverted };
}
